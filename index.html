<style>
  /* Layout: ruhige Arbeitsfläche – Kopfzeile mit Kennzahlen, Reiter, darunter Karten und Tabellen.
     Hell/Dunkel: folgt dem System, umschaltbar über den Knopf oben rechts (data-theme auf <html>). */
  /* Farben: 90 % neutral, Teal als einzige Akzentfarbe. Statusfarben gedämpft;
     für Text jeweils eine dunklere Stufe (Kontrast ≥ 4,5 : 1), Flächen/Diagramme in den Originaltönen.
     Diagramm-Reihen: series-1 Teal = steuerfrei/Anteil, series-2 Ocker = Haltefrist/kurzfristig.
     Weitere Reihen bei Bedarf: --c3 … --c6. */
  :root {
    --bg: #F6F6F3; --panel: #FCFCFA; --text: #202221; --muted: #737875; --line: #E2E3DE;
    --accent: #477D7C; --accent-ink: #FFFFFF; --accent-soft: #E3EDEC; --accent-line: #B9D0CE;
    --ok: #4E6A42; --ok-bg: #EDF0E9; --warn: #7D6720; --warn-bg: #F3F0E4; --err: #8E3F4A; --err-bg: #F4EAEB;
    --info: #5C615E; --info-bg: #EEEEEA;
    --up: #2F6B2A; --up-bg: #DDEBD5; --down: #9B2335; --down-bg: #F5DADD;
    --series-1: #477D7C; --series-2: #A89A62; --c3: #718A96; --c4: #87957D; --c5: #A86F76; --c6: #92928E;
    --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #141615; --panel: #1B1E1C; --text: #E6E8E4; --muted: #9A9F9B; --line: #2C302D;
    --accent: #6FA5A3; --accent-ink: #141615; --accent-soft: rgba(111,165,163,.16); --accent-line: rgba(111,165,163,.45);
    --ok: #A4B399; --ok-bg: #1F261C; --warn: #C9B97F; --warn-bg: #2A2618; --err: #C98E95; --err-bg: #2E1E20;
    --info: #C2C6C2; --info-bg: #232624;
    --up: #B9D8A6; --up-bg: rgba(122,170,96,.22); --down: #F0A8B1; --down-bg: rgba(200,80,98,.24);
    --series-1: #6FA5A3; --series-2: #C9B97F; --c3: #8FA8B4; --c4: #A4B399; --c5: #C98E95; --c6: #A9A9A4; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #141615; --panel: #1B1E1C; --text: #E6E8E4; --muted: #9A9F9B; --line: #2C302D;
    --accent: #6FA5A3; --accent-ink: #141615; --accent-soft: rgba(111,165,163,.16); --accent-line: rgba(111,165,163,.45);
    --ok: #A4B399; --ok-bg: #1F261C; --warn: #C9B97F; --warn-bg: #2A2618; --err: #C98E95; --err-bg: #2E1E20;
    --info: #C2C6C2; --info-bg: #232624;
    --up: #B9D8A6; --up-bg: rgba(122,170,96,.22); --down: #F0A8B1; --down-bg: rgba(200,80,98,.24);
    --series-1: #6FA5A3; --series-2: #C9B97F; --c3: #8FA8B4; --c4: #A4B399; --c5: #C98E95; --c6: #A9A9A4; color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-ui); }
  header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; padding-block: 14px; background: var(--panel); border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header .stats { display: flex; gap: 14px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  header .stats b { color: var(--text); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #storage.warn { color: var(--warn); font-weight: 600; }
  main { padding-block: 16px 48px; max-width: 1400px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  nav { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer; font: inherit; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  button:focus-visible, select:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 7px 13px; font: inherit; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--err); border: 1px solid var(--line); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 12px; min-width: 0; }
  .drop { border: 2px dashed var(--line); text-align: center; color: var(--muted); padding: 28px 16px; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .pill { display: inline-block; border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .error { color: var(--err); background: var(--err-bg); } .warning { color: var(--warn); background: var(--warn-bg); }
  .info { color: var(--info); background: var(--info-bg); } .okp { color: var(--ok); background: var(--ok-bg); }
  .issue { border-left: 3px solid var(--line); }
  .issue.sev-error { border-left-color: var(--err); } .issue.sev-warning { border-left-color: var(--warn); }
  .issue h3 { margin: 0 0 4px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .issue .detail { white-space: pre-wrap; color: var(--muted); word-break: break-word; }
  .issue .actions { margin-top: 8px; }
  .issue code { font-size: 11px; color: var(--muted); font-family: var(--font-num); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  select, input[type=search] { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); max-width: 100%; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: top; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  tr.excluded td { opacity: .45; text-decoration: line-through; }
  tr.excluded td:last-child, tr.excluded td:nth-last-child(2) { text-decoration: none; }
  tr.flagged td:first-child { box-shadow: inset 3px 0 var(--warn); }
  .muted { color: var(--muted); }
  tr.neg td { background: var(--err-bg); }
  tr.warnrow td { background: var(--warn-bg); }
  table.sum-table tr.strong td { font-weight: 650; }
  td.diff { color: var(--warn); }
  .pos { color: var(--ok); } .neg-t { color: var(--err); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .tile.warn { border-color: var(--warn); }
  .t-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .t-main { font: 600 22px/1.3 var(--font-num); font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  .t-main small { font: 12px var(--font-ui); color: var(--muted); }
  .t-sub { font-size: 12px; color: var(--muted); }
  td.free { background: color-mix(in srgb, var(--ok-bg) 60%, transparent); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .grid2 > .card { margin-bottom: 0; }
  .grid2 + .card { margin-top: 12px; }
  svg.chart { width: 100%; height: auto; max-width: 100%; }
  svg.chart .bar rect { fill: var(--accent); }
  svg.chart .bar:hover rect { opacity: .75; }
  svg.chart text { fill: var(--muted); font: 11px var(--font-ui); }
  svg.chart .axis { stroke: var(--line); }
  tr.neg td.num:nth-child(7) { color: var(--err); font-weight: 600; }
  dl.op { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 8px 0; }
  dl.op dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
  dl.op dd { margin: 0; white-space: pre-wrap; min-width: 0; }
  dl.op textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  @media (max-width: 560px) { dl.op { grid-template-columns: 1fr; } }
  .sum { display: flex; gap: 10px; flex-wrap: wrap; }
  .note { font-size: 13px; color: var(--muted); }
  .guide { max-width: 860px; }
  .guide h2 { font-size: 15px; margin: 0 0 8px; text-wrap: balance; }
  .guide p, .guide li { max-width: 68ch; }
  .guide ol, .guide ul { padding-left: 20px; margin: 0 0 8px; display: grid; gap: 4px; }
  .guide table.steps { margin: 4px 0 8px; }
  .guide table.steps td { white-space: normal; }
  /* Diagramme: series-1 (blau) = steuerfrei/Anteil, series-2 (orange) = in Haltefrist/kurzfristig */
  .rank { display: grid; gap: 7px; }
  .rank-row { display: grid; grid-template-columns: 5.2em minmax(40px, 1fr) 6.5em 3.6em; gap: 8px; align-items: center; font-size: 13px; }
  .rank-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-track { height: 12px; background: var(--info-bg); border-radius: 3px; overflow: hidden; }
  .rank-bar { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
  .rank-bar.other { background: var(--muted); opacity: .55; }
  .rank-val, .rank-pct, .dv-val { text-align: right; white-space: nowrap; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .rank-pct { color: var(--muted); }
  .rank-row:hover .rank-bar, .seg:hover { filter: brightness(1.12); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .s1 { background: var(--series-1); } .s2 { background: var(--series-2); }
  .split { display: grid; gap: 12px; }
  .split-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .split-track { display: flex; gap: 2px; height: 16px; margin: 4px 0; }
  .split-track .seg { display: block; border-radius: 3px; min-width: 3px; }
  .split-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dv { display: grid; gap: 8px; }
  .dv-row { display: grid; grid-template-columns: 5.2em minmax(60px, 1fr) 7.5em; gap: 8px; align-items: center; font-size: 13px; }
  .dv-track { position: relative; display: grid; gap: 2px; }
  .dv-bar { position: relative; display: block; height: 7px; }
  .dv-bar .seg { position: absolute; top: 0; height: 100%; border-radius: 2px; }
  .dv-zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .dv-val { display: grid; font-size: 12px; line-height: 1.25; }
  .segs { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .segs .note { margin-right: 4px; }
  .card > .segs { margin-bottom: 10px; }
  .seg-btn { font: inherit; font-size: 13px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; }
  .seg-btn:hover { border-color: var(--muted); }
  .seg-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  /* Formulare */
  input:not([type=checkbox]):not([type=file]), textarea { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); max-width: 100%; }
  .mform { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 12px; margin-top: 8px; }
  .mform label, .sim label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .mform input, .mform select { width: 100%; }
  .mform .wide { grid-column: 1 / -1; }
  .mform .dim { opacity: .5; }
  .sim { align-items: end; }
  .sim input, .sim select { width: 11em; }
  .sim-tiles { margin-top: 8px; }
  details summary { cursor: pointer; margin: 6px 0; }
  nav .sep { flex: 0 0 1px; background: var(--line); margin: 8px 6px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px 24px; }
  .report { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .report h2 { margin: 0 0 4px; font-size: 18px; } .report h3 { margin: 18px 0 6px; font-size: 14px; }
  .report .method { margin: 0; padding-left: 20px; font-size: 13px; }
  @media (max-width: 560px) { .rank-row { grid-template-columns: 4.2em minmax(30px, 1fr) 5.2em; } .rank-pct { display: none; } .dv-row { grid-template-columns: 4.2em minmax(40px, 1fr) 6.5em; } }
  @media print {
    header, nav, footer, .noprint { display: none !important; }
    body, .report, .card { background: #fff; color: #000; } main { max-width: none; padding: 0; }
    .report { border: 0; padding: 0; } .tablewrap { overflow: visible; border: 0; }
    table { font-size: 9.5px; } th, td { padding: 3px 5px; white-space: normal; } tr { break-inside: avoid; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  nav button.active { color: var(--accent); }
  .seg-btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
  svg.chart .bar rect { fill: var(--series-1); }
  /* Gewinn/Verlust als kleine Chips, damit Plus und Minus sofort unterscheidbar sind */
  .pos, .neg-t { font-weight: 600; }
  .pos { color: var(--up); } .neg-t { color: var(--down); }
  .chip, span.pos, span.neg-t { display: inline-block; padding: 1px 8px; border-radius: 6px; font-weight: 600; line-height: 1.5; }
  .chip.up, span.pos { background: var(--up-bg); color: var(--up); }
  .chip.down, span.neg-t { background: var(--down-bg); color: var(--down); }
  .t-main span.pos, .t-main span.neg-t { padding: 0; background: none; }
  .t-main .pos { color: var(--up); } .t-main .neg-t { color: var(--down); }
  /* iPhone: kompakter Kopf, Kacheln zu zweit, Tabellen umbrechen statt endlos scrollen */
  @media (max-width: 600px) {
    header { padding-block: 10px; gap: 6px 12px; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
    header h1 { font-size: 15px; }
    header .stats { font-size: 12px; gap: 8px; width: 100%; order: 3; }
    #storage { display: none; }
    main { padding-top: 10px; }
    nav { margin-bottom: 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
    nav button { padding: 10px 11px; }
    nav .sep { display: none; }
    .card { padding: 12px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { padding: 10px 11px; }
    .t-main { font-size: 17px; }
    .t-label { font-size: 10.5px; }
    .t-sub { font-size: 11.5px; }
    th, td { padding: 6px 7px; }
    table { font-size: 12.5px; }
    td:first-child { white-space: normal; min-width: 8.5em; }
    .seg-btn { padding: 6px 10px; }
    .grid2 { grid-template-columns: 1fr; }
    .btn { padding: 8px 12px; }
  }
  /* Kurzansicht (iPhone) */
  .mobile-only { display: none; }
  @media (max-width: 600px) { .mobile-only { display: inline-block; } }
  body.compact nav, body.compact header .stats, body.compact #storage { display: none; }
  body.compact main { max-width: 560px; }
  .q-hero { text-align: center; padding: 22px 0 18px; }
  .q-total { font: 600 38px/1.15 var(--font-num); font-variant-numeric: tabular-nums; margin: 6px 0; letter-spacing: -.01em; }
  .q-sub { color: var(--muted); font-size: 13px; }
  .q-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .q-pair .t-main { font-size: 19px; }
  .q-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .q-row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .q-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .q-bar { height: 6px; background: var(--info-bg); border-radius: 3px; margin: 6px 0 4px 32px; overflow: hidden; }
  .q-bar i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
  .q-meta { font-size: 12px; color: var(--muted); margin-left: 32px; }
  .q-actions { display: flex; gap: 8px; justify-content: center; margin: 8px 0 4px; }
  .q-center { text-align: center; }
  .theme-btn { background: none; border: 1px solid var(--line); border-radius: 99px; color: var(--text); font: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer; }
  .theme-btn:hover { border-color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Depot</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <span class="note" id="storage">Speicher wird geprüft …</span>
  <button class="theme-btn" id="themeToggle" type="button" aria-label="Hell oder dunkel">Hell / Dunkel</button>
</header>
<main>
  <nav id="tabs">
    <button data-tab="quick" class="mobile-only">Kurz</button>
    <button data-tab="dash">Dashboard</button>
    <button data-tab="ana">Analyse</button>
    <button data-tab="tax">Steuer</button>
    <span class="sep"></span>

    <p>Du ziehst deine Exporte in die App. Sie liest sie <b>nur in diesem Browser</b>, es wird nichts hochgeladen. Daraus entstehen Bestand, Steuerbericht und Auswertungen. Was in keinem Export steht, erfasst du von Hand.</p>
    <table class="steps"><tr><th>Reiter</th><th>Wof\xFCr</th></tr>
      <tr><td>Dashboard</td><td>Portfoliowert, Verteilung, was jetzt steuerfrei verkauft werden kann, kommende Freigaben</td></tr>
      <tr><td>Analyse</td><td>Verkaufssimulator, realisiert je Jahr und Coin, Staking, Einstandskurse, Verteilung nach Wallet</td></tr>
      <tr><td>Steuer</td><td>Ergebnis je Jahr (\xA7 23, \xA7 22 Nr. 3), Abgleich mit CoinTracking, Bericht als CSV oder PDF</td></tr>
      <tr><td>Buchungen</td><td>Alle Zeilen mit Filter; einzelne Zeilen ausschlie\xDFen</td></tr>
      <tr><td>Erfassen</td><td>Buchungen von Hand: MEXC-Trades, Tangem, Nova Wallet, Korrekturen</td></tr>
      <tr><td>Import</td><td>Exporte, Kurse, Sicherung einlesen</td></tr>
      <tr><td>Abgleich</td><td>Gegenprobe: stimmt der Bestand der App mit B\xF6rse und Wallet \xFCberein?</td></tr>
      <tr><td>Pr\xFCfliste, Offene Punkte</td><td>Auff\xE4lligkeiten in den Daten und festgehaltene Unklarheiten mit Belegen</td></tr>
    </table>
  </section>
  <section class="card">
    <h2>Monatliche Routine (10 Minuten)</h2>
    <ol>
      <li><b>Exporte ziehen</b> bei Bitpanda und Bitvavo (CSV, gesamter Zeitraum), bei MEXC die Auszahlungshistorie (XLSX). In den Reiter <b>Import</b> ziehen. Bekannte Zeilen werden \xFCbersprungen.</li>
      <li><b>Erfassen</b>, was kein Export liefert: MEXC-K\xE4ufe und -Einzahlungen, \xDCberweisungen auf Tangem, Staking in der Nova Wallet.</li>
      <li><b>Abgleich</b>: je B\xF6rse und Wallet die echten Best\xE4nde eintragen. Stimmt alles, fehlt nichts.</li>
      <li><b>Sicherung speichern</b> (Einstellungen) und in deinem Ordner ablegen.</li>
    </ol>
    <p class="note">Zum Jahresende zus\xE4tzlich: Reiter Steuer \u2192 fehlende Kurse laden \u2192 Bericht als CSV und PDF speichern.</p>
  </section>
  <section class="card">
    <h2>Exporte</h2>
    <table class="steps"><tr><th>Quelle</th><th>Wo</th><th>Gilt f\xFCr</th></tr>
      <tr><td>CoinTracking</td><td>Enter Coins \u2192 Trade Table \u2192 Export \u2192 CSV</td><td>alles bis 31.12.2025 (einmalig, vor der K\xFCndigung)</td></tr>
      <tr><td>Bitpanda</td><td>Profil \u2192 Verlauf \u2192 Transaktionen exportieren (CSV)</td><td>Bitpanda ab 01.01.2026</td></tr>
      <tr><td>Bitvavo</td><td>Konto \u2192 Transaktionshistorie \u2192 vollst\xE4ndige Historie (CSV)</td><td>Bitvavo ab 01.01.2026</td></tr>
      <tr><td>MEXC</td><td>Auszahlungshistorie (XLSX) \u2013 mehr bietet MEXC nicht</td><td>Auszahlungen ab 01.01.2026; Trades und Einzahlungen im Reiter Erfassen</td></tr>
      <tr><td>CoinTracking-Steuerbericht</td><td>\u201EAuszug f\xFCr die Steuererkl\xE4rung\u201C (XLSX), je Jahr</td><td>Referenz f\xFCr den Abgleich und Kursquelle f\xFCr das Berichtsjahr</td></tr>
      <tr><td>kurse.csv</td><td>Datum, Asset, EUR, Quelle (EUR je Einheit)</td><td>fehlende Kurse von Hand erg\xE4nzen</td></tr>
      <tr><td>offene-punkte.csv</td><td>in deinem Ordner</td><td>Unklarheiten zum Nachpr\xFCfen</td></tr>
      <tr><td>manuelle-buchungen.csv</td><td>wird im Reiter Erfassen gepflegt und gespeichert</td><td>immer</td></tr>
      <tr><td>Sicherung (.json)</td><td>Einstellungen \u2192 Sicherung speichern</td><td>stellt den kompletten Stand wieder her</td></tr>
    </table>
    <p class="note">Exporte nicht in Excel \xF6ffnen und neu speichern. Men\xFCpfade der B\xF6rsen k\xF6nnen sich \xE4ndern.</p>
  </section>
  <section class="card">
    <h2>Kurse</h2>
    <p>Aktuelle Kurse und Tageskurse der letzten 365 Tage kommen von CoinGecko, direkt aus dem Browser. An CoinGecko gehen nur die Namen der Coins, keine Mengen. Das funktioniert in der Datei <code>Krypto-Steuer.html</code>, nicht im Claude-Artefakt. Ohne Schl\xFCssel bremst CoinGecko schnell; ein kostenloser Demo-Schl\xFCssel (Einstellungen) hilft.</p>
  </section>
  <section class="card">
    <h2>Steuerbericht</h2>
    <p>Im Reiter <b>Steuer</b> w\xE4hlst du Jahr und Berechnung. <b>Bericht als CSV</b> enth\xE4lt jede Ver\xE4u\xDFerung und jede Einnahme einzeln. <b>Druckansicht</b> ergibt \xFCber den Druckdialog ein PDF. Der Bericht nennt die Methodik und sagt deutlich, wenn Kurse fehlen.</p>
    <p class="note">Die App ersetzt keine Steuerberatung. Welche Berechnung (wie CoinTracking oder korrigiert) abgegeben wird, entscheidest du mit dem Steuerberater.</p>
  </section>
  <section class="card">
    <h2>Daten und Sicherheit</h2>
    <p>Alles liegt im Speicher dieses Browsers. L\xF6schst du die Browserdaten, ist der Stand weg. Deshalb: Exporte aufbewahren und regelm\xE4\xDFig die Sicherung speichern. Die Sicherung enth\xE4lt alle Buchungen, Kurse, Abgleiche und offenen Punkte, aber nicht den CoinGecko-Schl\xFCssel. Adressen und Konto-Kennungen speichert die App gar nicht erst.</p>
  </section>
